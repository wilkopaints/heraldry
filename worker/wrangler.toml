name = "heraldry-og"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Single wildcard route — exact-match routes don't reliably fire with query params.
# CSS/JS/device images all pass straight through via fetch(request).
routes = [
  { pattern = "wilkopaints.art/heraldry*", zone_name = "wilkopaints.art" }
]

# Treat .wasm files as pre-compiled WebAssembly modules.
# Cloudflare compiles the WASM at deploy time so cold-start cost is ~1ms instantiation,
# not ~12ms compilation — this is the key to staying within the 10ms free-tier CPU limit.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false


